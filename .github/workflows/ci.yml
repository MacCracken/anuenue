name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable: release.yml's CI gate calls this via `uses:` and needs
  # the workflow_call trigger to be declared explicitly.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout, and it is what
        # this repo shipped through v1.2.0. From 6.5.x `cyrius deps` resolves
        # the stdlib snapshot from $HOME/.cyrius/versions/$CYRIUS_VERSION/lib
        # and hard-fails with "pins version X but it is not installed" when only
        # the flattened dirs exist — so the v1.2.1 pin bump to 6.5.35 would have
        # broken CI on the first push. The installer lays out
        # versions/<v>/{bin,lib} and symlinks bin/ + lib/ at it, and additionally
        # does SHA256 + signature verification the hand-rolled block skipped.
        # Same pattern as darshana / patra / libro.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here, with an error that
        # points at the manifest rather than at the installer.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        # CYRIUS_DCE=1 per CLAUDE.md "every `cyrius build` in CI and release
        # runs with CYRIUS_DCE=1". It was absent here and in release.yml
        # through v1.2.0, so the documented rule was never actually enforced.
        # On 6.5.x DCE NOPs unreachable functions in place rather than removing
        # them, so this no longer changes the output SIZE — it is still the
        # documented build mode, and the release artifact is now built the same
        # way CI tests it.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/${{ github.event.repository.name }}
          echo "binary: $(wc -c < build/${{ github.event.repository.name }}) bytes"

      - name: Lint
        # `cyrius lint` gained an untracked-deferral check that the 6.4.62
        # pin did not run; src/filter.cyr tripped it on the v1.2.1 bump.
        # Gate it so the next one is caught by CI rather than by the next
        # person to bump the pin. Zero tolerance: anuenue's src/ is seven
        # files and has been warning-clean since v0.9.0.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            echo "$out" | grep -qE '^0 warnings' || fail=1
            echo "$out" | grep -qE '^0 untracked deferrals' || fail=1
          done
          [ $fail -eq 0 ] || { echo "::error::lint warnings or untracked deferrals present"; exit 1; }

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Golden output (determinism)
        # The M2 -s flag is the deterministic-output hook; this
        # script diffs committed byte sequences against fresh
        # runs to catch regressions in the filter loop, HSV
        # geometry, or darshana's escape format. To accept a
        # deliberate change, regenerate the fixtures locally and
        # document the visual delta in CHANGELOG.md.
        run: sh scripts/golden-check.sh

      - name: Animation smoke (M4)
        # Animation is non-deterministic (frame count varies with
        # host load), so it can't have a byte-identical golden.
        # This script asserts the structural contract instead:
        # exit 0 on duration-elapsed AND on SIGINT, cursor-hide /
        # cursor-show framing present, at least one cursor-up
        # between frames. Specifically catches the "terminal left
        # with hidden cursor after SIGINT" regression class that
        # the M4 acceptance criterion calls out. v0.8.0 added the
        # M8-audit long-cluster regression section; v0.9.0 added
        # the --color=256 / --color=16 + -a per-mode sections.
        run: sh scripts/animate-smoke.sh

      - name: Fuzz harness (v0.9.0)
        # Five fcyr harnesses in fuzz/ target the surfaces the M8
        # audit identified: flag parser, UTF-8, _pretag_clusters,
        # _emit_phase_esc, RGB quantizers. Each uses a Knuth-MMIX
        # LCG for deterministic seed-driven exploration and returns
        # assert_summary() so failing invariants set a non-zero
        # exit. ~1.35M assertions per run on the current corpus.
        run: cyrius fuzz

      - name: Observability gate (v1.2.1)
        # The sakshi/agnostik wiring's load-bearing property is one a unit
        # test cannot express: enabling -v must not move a single byte of
        # STDOUT. anuenue lives in the middle of pipelines, so a diagnostics
        # feature that leaked one byte onto fd 1 would corrupt every
        # `iam | anuenue | ...` it was enabled in. The script asserts that
        # across every corpus x colour-mode x verbosity combination, plus
        # silence at default verbosity, the -v field set, and the
        # agnostik-typed failure path with its numeric code.
        run: sh scripts/observe-check.sh

      - name: distlib drift check
        # dist/anuenue.cyr is what consumers `include`, not src/. Without
        # this gate a src/hsv.cyr change can land while the shipped bundle
        # stays stale. v1.2.1 also added dist/anuenue.deps — the 6.5.x
        # stdlib-leaf sidecar that `cyrius distlib --check` treats a missing
        # copy of as STALE, so it must be committed alongside the bundle.
        run: cyrius distlib --check

      - name: Version consistency
        # Asserts VERSION matches every place the version literal
        # lives. Drift detection per the cyim 1.2.2 lesson — without
        # this gate, `anuenue --version` can ship stale data even
        # with a green build + green tests. To fix a drift report,
        # run `sh scripts/version-bump.sh "$(cat VERSION)"`.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          # CHANGELOG must have a section for this version (release
          # cuts move work out of [Unreleased] into [X.Y.Z]; a fresh
          # cycle-open in [Unreleased] is fine — we only block when
          # VERSION is bumped without a matching CHANGELOG section).
          grep -qE "^## \[${VERSION}\]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md missing section [${VERSION}]"; exit 1; }
          # cyrius.cyml pulls from VERSION via ${file:VERSION} — confirm
          # the indirection hasn't drifted to a hardcoded value.
          grep -qE '^version *= *"\$\{file:VERSION\}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version no longer pulls from VERSION"; exit 1; }
          # The `anuenue X.Y.Z` literal lives in src/version_str.cyr
          # (auto-generated by scripts/version-bump.sh per the cyim
          # pattern). print_version() in src/main.cyr reads the var
          # rather than embedding the string, so this is the surface
          # that drifts.
          grep -qE "_VERSION_STR_ANUENUE *= *\"anuenue ${VERSION}\\\\n\"" src/version_str.cyr \
            || { echo "FAIL: src/version_str.cyr != $VERSION (run: sh scripts/version-bump.sh \"\$(cat VERSION)\")"; exit 1; }
          echo "Version consistent: VERSION = CHANGELOG = cyrius.cyml = version_str.cyr = $VERSION"
